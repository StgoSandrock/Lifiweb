                'estadio croata': 'Estadio Croata',
                'newen': 'Ultimate S.A',
                'ultimate': 'Ultimate S.A',
                'ultimate sa': 'Ultimate S.A',
                'ultimate sports academy': 'Ultimate S.A',
                'uc chicureo': 'Inter',
                'u c chicureo': 'Inter',
                'inter': 'Inter',
                'lif': 'LIF',
                'bianconero': 'Bianconero'
            };
            return aliases[key] || cleanText(name);
        };

        const isUcChicureoPlayer = (player) => {
            const club = foldText(player?.club || '');
            return club === 'uc chicureo' || club === 'u c chicureo';
        };

        const playerIdentityKey = (player) => [
            normalizeClubName(player.club),
            player.categoria,
            player.cupPlayer === true ? 'cup' : 'liga',
            foldText(player.nombre)
        ].join('|');

        const dedupePlayers = (players) => {
            const unique = new Map();
            players.forEach(player => {
                const key = playerIdentityKey(player);
                if (!unique.has(key)) unique.set(key, player);
            });
            return [...unique.values()];
        };

        const normalizePlayers = (players, resetStats = false) => dedupePlayers(players
            .filter(player => !isUcChicureoPlayer(player))
            .map(player => ({
                ...player,
                nombre: cleanText(player.nombre),
                club: normalizeClubName(player.club),
                cupPlayer: player.cupPlayer === true,
                posicion: player.posicion || 'Jugador',
                goles: resetStats ? 0 : (Number(player.goles) || 0),
                asistencias: resetStats ? 0 : (Number(player.asistencias) || 0),
                pj: resetStats ? 0 : (Number(player.pj) || 0),
                ta: resetStats ? 0 : (Number(player.ta) || 0),
                tr: resetStats ? 0 : (Number(player.tr) || 0)
            })));

        const mergeRosterPlayers = (players, resetStats = false) => {
            const normalized = normalizePlayers(players, resetStats);
            const knownKeys = new Set(normalized.map(playerIdentityKey));
            const missing = INITIAL_MOCK_PLAYERS
                .filter(player => !knownKeys.has(playerIdentityKey(player)))
                .map(player => ({ ...player }));
            return {
                players: normalizePlayers([...normalized, ...missing], resetStats),
                missing
            };
        };

        const fixtureRoundNumber = (fixture) => {
            const match = String(fixture?.fecha || '').match(/\d+/);
            return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
        };

        const sortFixtures = (fixtures) => [...fixtures].sort((a, b) => {
            const roundDiff = fixtureRoundNumber(a) - fixtureRoundNumber(b);
            if (roundDiff !== 0) return roundDiff;
            const dateDiff = String(a.fechaCompleta || '').localeCompare(String(b.fechaCompleta || ''));
            if (dateDiff !== 0) return dateDiff;
            const orderDiff = Number(a.orden || 99) - Number(b.orden || 99);
            if (orderDiff !== 0) return orderDiff;
            const timeDiff = String(a.hora || '').localeCompare(String(b.hora || ''));
            if (timeDiff !== 0) return timeDiff;
            return String(a.local || '').localeCompare(String(b.local || ''), 'es');
        });

        const groupFixturesByRound = (fixtures) => sortFixtures(fixtures).reduce((rounds, fixture) => {
            const roundLabel = fixture.fecha || 'Fecha por definir';
            if (!rounds[roundLabel]) rounds[roundLabel] = [];
            rounds[roundLabel].push(fixture);
            return rounds;
        }, {});

        const getClubLogo = (clubName) => {
            const normalizedName = normalizeClubName(clubName);
            return LIGA_CLUBS.find(club => club.name === normalizedName)?.logo || '';
        };

        const normalizeFixtures = (fixtures, resetStats = false) => sortFixtures(fixtures.map(fixture => ({
            ...fixture,
            tournament: 'clausura',
            isCup: fixture.isCup === true,
            local: normalizeClubName(fixture.local),
            visita: normalizeClubName(fixture.visita),
            golesL: resetStats ? 0 : (Number(fixture.golesL) || 0),
            golesV: resetStats ? 0 : (Number(fixture.golesV) || 0),
            status: resetStats ? 'pending' : (fixture.status || 'pending'),
            fechaCompleta: fixture.fechaCompleta || '',
            cancha: fixture.cancha || 'Por definir',
            hora: fixture.hora || 'Por definir'
        })));

        const fixtureIdentityKey = (fixture) => {
            const teams = [normalizeClubName(fixture.local), normalizeClubName(fixture.visita)].sort();
            return [fixture.category, fixtureRoundNumber(fixture), ...teams].join('|');
        };

        const reconcileOfficialFixtures = (fixtures, resetStats = false) => {
            const normalized = normalizeFixtures(fixtures, resetStats);
            const existingByKey = new Map();
            normalized.filter(fixture => !fixture.isCup).forEach(fixture => {
                const key = fixtureIdentityKey(fixture);
                if (!existingByKey.has(key)) existingByKey.set(key, fixture);
            });

            const matchedIds = new Set();
            const official = OFFICIAL_LIGA_FIXTURES.map(baseFixture => {
                const existing = existingByKey.get(fixtureIdentityKey(baseFixture));
                if (!existing) return { ...baseFixture };
                matchedIds.add(existing.id);
                return {
                    ...existing,
                    ...baseFixture,
                    id: existing.id,
                    golesL: resetStats ? 0 : (Number(existing.golesL) || 0),
                    golesV: resetStats ? 0 : (Number(existing.golesV) || 0),
                    status: resetStats ? 'pending' : (existing.status || 'pending'),
                    fechaCompleta: existing.fechaCompleta || '',
                    cancha: existing.cancha || 'Por definir',
                    hora: existing.hora || 'Por definir'
                };
            });

            const cupFixtures = normalized.filter(fixture => fixture.isCup);
            const obsoleteLeagueIds = normalized
                .filter(fixture => !fixture.isCup && !matchedIds.has(fixture.id))
                .map(fixture => fixture.id);
            return {
                fixtures: sortFixtures([...cupFixtures, ...official]),
                official,
                obsoleteLeagueIds
            };
        };

        // ==========================================
        // 3. ESTADO GLOBAL (LOCAL STATE)
        // ==========================================
        let state = {
            view: 'lobby',          
            activeMode: 'liga',      
            tournament: 'clausura', 
            subView: 'tabla',       
            selectedClub: null,     
            category: 'infantil',   
            players: normalizePlayers(INITIAL_MOCK_PLAYERS),
            fixtures: normalizeFixtures(INITIAL_MOCK_FIXTURES),
            currentUser: null,
            isAdmin: false          
        };

        window.setState = function(updatedState) {
            state = { ...state, ...updatedState };
            render();
        };

        window.selectClubView = function(clubName) {
            window.setState({ selectedClub: clubName });
            window.scrollTo(0, 0);
        };

        // ==========================================
        // 4. LÓGICA DE FIREBASE Y PANELES (FALLBACK MODO DEMO)
        // ==========================================
        let playerSyncInProgress = false;
        let fixtureSyncInProgress = false;
        let resetStatsOnNextSync = false;
        let playerResetComplete = false;
        let fixtureResetComplete = false;
        let resetMarkerRef = null;

        const runTasksInBatches = async (tasks, batchSize = 40) => {
            for (let index = 0; index < tasks.length; index += batchSize) {
                await Promise.all(tasks.slice(index, index + batchSize).map(task => task()));
            }
        };

        const markResetCompletedIfReady = async () => {
            if (!resetStatsOnNextSync || !playerResetComplete || !fixtureResetComplete || !resetMarkerRef) return;
            await setDoc(resetMarkerRef, {
                completed: true,
                completedAt: new Date().toISOString()
            });
            resetStatsOnNextSync = false;
        };

        const initAuthAndSync = async () => {
            if (!isFirebaseConfigured) {
                const roster = mergeRosterPlayers(INITIAL_MOCK_PLAYERS);
                const fixtureData = reconcileOfficialFixtures(INITIAL_MOCK_FIXTURES);
                window.setState({ players: roster.players, fixtures: fixtureData.fixtures });
                return;
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Error al autenticar en Firebase:", error);
            }

            onAuthStateChanged(auth, async (user) => {
                if (!user) return;
                state.currentUser = user;
                resetMarkerRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'clausura-fixture-rosters-v3');
                try {
                    const resetMarker = await getDoc(resetMarkerRef);
                    resetStatsOnNextSync = !resetMarker.exists();
                } catch (error) {
                    console.warn('No se pudo verificar la migración inicial; se conservarán las estadísticas actuales.', error);
                    resetStatsOnNextSync = false;
                }

                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'jugadores'), async (snapshot) => {
                    if (playerSyncInProgress) return;
                    const shouldResetStats = resetStatsOnNextSync;
                    const fetchedPlayers = snapshot.docs.map(playerDoc => ({ id: playerDoc.id, ...playerDoc.data() }));
                    const rosterData = mergeRosterPlayers(fetchedPlayers, shouldResetStats);
                    window.setState({ players: rosterData.players });

                    const tasks = [];
                    snapshot.docs.forEach(playerDoc => {
                        const player = playerDoc.data();
                        if (isUcChicureoPlayer(player)) {
                            tasks.push(() => deleteDoc(playerDoc.ref));
                        } else if (shouldResetStats && (player.goles || player.asistencias || player.pj || player.ta || player.tr)) {
                            tasks.push(() => updateDoc(playerDoc.ref, { goles: 0, asistencias: 0, pj: 0, ta: 0, tr: 0 }));
                        }
                    });
                    rosterData.missing.forEach(player => {
                        tasks.push(() => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jugadores', player.id), player));
                    });

                    let syncSucceeded = true;
                    if (tasks.length > 0) {
                        playerSyncInProgress = true;
                        try {
                            await runTasksInBatches(tasks);
                        } catch (error) {
                            syncSucceeded = false;
                            console.error('No fue posible sincronizar todas las nóminas:', error);
                        } finally {
                            playerSyncInProgress = false;
                        }
                    }
                    if (syncSucceeded) {
                        playerResetComplete = true;
                        try {
                            await markResetCompletedIfReady();
                        } catch (error) {
                            console.error('No se pudo cerrar la migración inicial de estadísticas:', error);
                        }
                    }
                });

                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'partidos'), async (snapshot) => {
                    if (fixtureSyncInProgress) return;
                    const shouldResetStats = resetStatsOnNextSync;
                    const fetchedFixtures = snapshot.docs.map(fixtureDoc => ({ id: fixtureDoc.id, ...fixtureDoc.data() }));
                    const fixtureData = reconcileOfficialFixtures(fetchedFixtures, shouldResetStats);
                    window.setState({ fixtures: fixtureData.fixtures });

                    const rawById = new Map(fetchedFixtures.map(fixture => [fixture.id, fixture]));
                    const tasks = [];
                    fixtureData.official.forEach(fixture => {
                        const raw = rawById.get(fixture.id);
                        const requiresWrite = !raw
                            || raw.tournament !== 'clausura'
                            || raw.isCup !== false
                            || raw.category !== fixture.category
                            || raw.fecha !== fixture.fecha
                            || normalizeClubName(raw.local) !== fixture.local
                            || normalizeClubName(raw.visita) !== fixture.visita
                            || Number(raw.orden || 0) !== fixture.orden
                            || (shouldResetStats && raw.status !== 'pending')
                            || (shouldResetStats && Number(raw.golesL || 0) !== 0)
                            || (shouldResetStats && Number(raw.golesV || 0) !== 0);
                        if (requiresWrite) {
                            tasks.push(() => setDoc(
                                doc(db, 'artifacts', appId, 'public', 'data', 'partidos', fixture.id),
                                fixture,
                                { merge: true }
                            ));
                        }
                    });
                    fixtureData.obsoleteLeagueIds.forEach(id => {
                        tasks.push(() => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'partidos', id)));
                    });
                    snapshot.docs.forEach(fixtureDoc => {
                        const fixture = fixtureDoc.data();
                        if (fixture.isCup === true && (fixture.tournament !== 'clausura' || (shouldResetStats && (fixture.status === 'played' || fixture.golesL || fixture.golesV)))) {
                            tasks.push(() => updateDoc(fixtureDoc.ref, {
                                tournament: 'clausura',
                                ...(shouldResetStats ? { golesL: 0, golesV: 0, status: 'pending' } : {})
                            }));
                        }
                    });

                    let syncSucceeded = true;
                    if (tasks.length > 0) {
                        fixtureSyncInProgress = true;
                        try {
                            await runTasksInBatches(tasks);
                        } catch (error) {
                            syncSucceeded = false;
                            console.error('No fue posible sincronizar todo el fixture:', error);
                        } finally {
                            fixtureSyncInProgress = false;
                        }
                    }
                    if (syncSucceeded) {
                        fixtureResetComplete = true;
                        try {
                            await markResetCompletedIfReady();
                        } catch (error) {
                            console.error('No se pudo cerrar la migración inicial de resultados:', error);
                        }
                    }
                });
            });
        };

        // ==========================================
        // 5. CÁLCULOS EN TIEMPO REAL
        // ==========================================
        function getRealTopScorers(isCup) {
            const targetCats = isCup ? CATEGORIES.filter(c => CUP_CATEGORIES.includes(c.id)) : CATEGORIES;
            return targetCats.map(cat => {
                const catPlayers = state.players.filter(p => p.categoria === cat.id && p.cupPlayer === isCup);
                if (catPlayers.length === 0) return { category: cat.name, nombre: 'Pendiente', club: '---', goles: 0 };
                const sorted = [...catPlayers].sort((a, b) => b.goles - a.goles);
                const maxGoles = sorted[0]?.goles || 0;
                
                const leaders = sorted.filter(p => p.goles === maxGoles && maxGoles > 0);
                if (leaders.length === 0) {
                    return { category: cat.name, nombre: 'Pendiente', club: '---', goles: 0 };
                } else if (leaders.length === 1) {
                    return { category: cat.name, nombre: leaders[0].nombre, club: leaders[0].club, goles: leaders[0].goles };
                } else {
                    return { category: cat.name, nombre: leaders.map(l => l.nombre).join(' / '), club: 'Empate', goles: maxGoles };
                }
            });
        }

        function getStandings() {
            const isCup = state.activeMode === 'cup';
            const clubs = isCup 
                ? (CUP_CLUBS_BY_CATEGORY[state.category] || []).map(name => {
                    const mapped = LIGA_CLUBS.find(c => c.name === name);
                    return mapped ? mapped : { id: name.toLowerCase().replace(/\s+/g, ''), name, logo: '' };
                })
                : LIGA_CLUBS;

            const stats = {};
            clubs.forEach(club => { stats[club.name] = { id: club.id, name: club.name, logo: club.logo, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dg: 0, pts: 0 }; });

            const filteredFixtures = state.fixtures.filter(f => f.tournament === state.tournament && f.isCup === isCup && f.category === state.category && f.status === 'played');

            filteredFixtures.forEach(m => {
                if (!stats[m.local] || !stats[m.visita]) return;
                stats[m.local].pj++; stats[m.visita].pj++;
                stats[m.local].gf += m.golesL; stats[m.local].gc += m.golesV;
                stats[m.visita].gf += m.golesV; stats[m.visita].gc += m.golesL;

                if (m.golesL > m.golesV) { stats[m.local].pg++; stats[m.local].pts += 3; stats[m.visita].pp++; } 
                else if (m.golesL < m.golesV) { stats[m.visita].pg++; stats[m.visita].pts += 3; stats[m.local].pp++; } 
                else { stats[m.local].pe++; stats[m.local].pts += 1; stats[m.visita].pe++; stats[m.visita].pts += 1; }
                
                stats[m.local].dg = stats[m.local].gf - stats[m.local].gc;
                stats[m.visita].dg = stats[m.visita].gf - stats[m.visita].gc;
            });

            return Object.values(stats).sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.dg !== a.dg) return b.dg - a.dg;
                return b.gf - a.gf;
            });
        }

                                </button>
                                
                                <div class="w-28 h-28 bg-white rounded-[2rem] p-5 shadow-2xl flex items-center justify-center shrink-0">
                                    ${getClubLogo(state.selectedClub) ? `<img src="${getClubLogo(state.selectedClub)}" alt="Logo de ${state.selectedClub}" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'" /><span class="hidden text-blue-950 font-black italic text-2xl uppercase">${state.selectedClub.substring(0,3)}</span>` : `<span class="text-blue-950 font-black italic text-2xl uppercase">${state.selectedClub.substring(0,3)}</span>`}
                                </div>
                                <div>
                                    <h2 class="text-5xl md:text-6xl font-black italic uppercase tracking-tighter leading-none">${state.selectedClub}</h2>
                                    <p class="text-yellow-500 font-bold uppercase text-[10px] tracking-[0.4em] mt-3">Estadísticas Plantel 2026 - Serie ${CATEGORIES.find(c => c.id === state.category)?.name}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <main class="container mx-auto px-4 -mt-10 pb-20 flex-grow">
                        <div class="bg-white rounded-[3.5rem] shadow-2xl border border-slate-200/50 overflow-hidden animate-fade-in">
                            <div class="hidden md:block overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase text-slate-400 tracking-widest">
                                        <tr>
                                            <th class="p-8 px-10">Jugador</th>
                                            <th class="p-8 text-center">PJ</th>
                                            <th class="p-8 text-center">Goles</th>
                                            <th class="p-8 text-center">Asist.</th>
                                            <th class="p-8 text-center">Tarjetas</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${clubPlayers.map(p => `
                                            <tr class="hover:bg-slate-50/50 transition-all group">
                                                <td class="p-8 px-10">
                                                    <div class="flex flex-col">
                                                        <span class="font-black uppercase text-blue-950 text-2xl italic tracking-tighter group-hover:translate-x-1 transition-transform">${p.nombre}</span>
                                                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">${p.posicion || 'Jugador'}</span>
                                                    </div>
                                                </td>
                                                <td class="p-8 text-center font-bold text-slate-400 text-lg">${p.pj || 0}</td>
                                                <td class="p-8 text-center font-black text-3xl italic text-blue-950">${p.goles || 0}</td>
                                                <td class="p-8 text-center font-bold text-slate-400 text-lg">${p.asistencias || 0}</td>
                                                <td class="p-8 text-center">
                                                    <div class="flex justify-center gap-2">
                                                        ${Array(p.ta || 0).fill(0).map(() => `<div class="w-4 h-6 bg-yellow-400 rounded-sm shadow-md"></div>`).join('')}
                                                        ${Array(p.tr || 0).fill(0).map(() => `<div class="w-4 h-6 bg-red-500 rounded-sm shadow-md"></div>`).join('')}
                                                        ${(p.ta || 0) === 0 && (p.tr || 0) === 0 ? `<span class="text-slate-200">-</span>` : ''}
                                                    </div>
                                                </td>
                                            </tr>
                                        `).join('')}
                                        ${clubPlayers.length === 0 ? `<tr><td colspan="5" class="p-20 text-center text-slate-400 font-bold uppercase tracking-widest italic">No hay jugadores registrados en esta categoría</td></tr>` : ''}
                                    </tbody>
                                </table>
                            </div>

                            <div class="md:hidden p-6 space-y-4">
                                ${clubPlayers.map(p => `
                                    <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200/50 space-y-4 shadow-sm">
                                        <div class="flex justify-between items-start border-b pb-4">
                                            <div>
                                                <h4 class="font-black text-blue-950 uppercase italic text-lg leading-none">${p.nombre}</h4>
                                                <p class="text-[9px] font-black text-slate-400 uppercase mt-2 tracking-widest">${p.posicion || 'Jugador'}</p>
                                            </div>
                                            <div class="flex gap-1.5">
                                                ${Array(p.ta || 0).fill(0).map(() => `<div class="w-3 h-5 bg-yellow-400 rounded-sm"></div>`).join('')}
                                                ${Array(p.tr || 0).fill(0).map(() => `<div class="w-3 h-5 bg-red-500 rounded-sm"></div>`).join('')}
                                            </div>
                                        </div>
                                        <div class="grid grid-cols-3 gap-3 text-center">
                                            <div class="bg-white p-3 rounded-2xl border"><span class="block text-[8px] font-black text-slate-400 uppercase">PJ</span><span class="font-black text-xl italic text-slate-700">${p.pj || 0}</span></div>
                                            <div class="bg-blue-50 p-3 rounded-2xl border border-blue-100"><span class="block text-[8px] font-black text-blue-400 uppercase">Goles</span><span class="font-black text-xl italic text-blue-700">${p.goles || 0}</span></div>
                                            <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100"><span class="block text-[8px] font-black text-emerald-400 uppercase">Asist</span><span class="font-black text-xl italic text-emerald-700">${p.asistencias || 0}</span></div>
                                        </div>
                                    </div>
                                `).join('')}
                                ${clubPlayers.length === 0 ? `<p class="p-12 text-center text-slate-400 font-bold uppercase italic text-xs">No hay jugadores registrados</p>` : ''}
                            </div>
                        </div>
                    </main>
                    ${renderFooter()}
                </div>`;
            }

            return `
            <div class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased flex flex-col">
                ${NavbarHeader()}
                
                <div class="bg-blue-950 text-white overflow-x-auto hide-scrollbar scroll-smooth">
                    <div class="container mx-auto px-4 md:px-8 flex justify-between items-center">
                        <div class="flex space-x-8 shrink-0">
                            ${categoriesToDisplay.map(cat => `
                                <button onclick="setState({ category: '${cat.id}', selectedClub: null })" class="py-6 text-[10px] font-black uppercase tracking-[0.2em] border-b-2 transition-all ${state.category === cat.id ? 'border-yellow-500 text-yellow-500' : 'border-transparent text-white/40 hover:text-white'}">
                                    ${cat.name}
                                </button>
                            `).join('')}
                        </div>
                        <div class="flex bg-white/15 px-4 py-3 rounded-xl shrink-0 my-3 ml-4">
                            <span class="text-[9px] font-black uppercase tracking-[0.2em] text-white">Torneo Clausura</span>
                        </div>
                    </div>
                </div>

                <main class="container mx-auto px-4 py-12 flex-grow animate-fade-in">
                    <div class="space-y-12">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                            <div>
                                <h2 class="text-5xl md:text-6xl font-black text-blue-950 uppercase italic tracking-tighter leading-none">
                                    ${isCup ? 'LIFI CUP' : 'LIGA LIFI'}
                                </h2>
                                <p class="text-slate-400 font-bold uppercase text-[10px] tracking-[0.4em] mt-3">
                                    Competición Juvenil 2026 • Torneo ${state.tournament.toUpperCase()} • Serie ${CATEGORIES.find(c => c.id === state.category)?.name}
                                </p>
                            </div>
                            <div class="flex bg-white p-1.5 rounded-2xl shadow-xl border border-slate-200">
                                <button onclick="setState({ subView: 'tabla' })" class="px-8 py-3.5 rounded-xl text-[10px] font-black uppercase transition-all ${state.subView === 'tabla' ? 'bg-blue-950 text-white shadow-lg' : 'text-slate-400 hover:text-blue-950'}">Clasificación</button>
                                <button onclick="setState({ subView: 'fixture' })" class="px-8 py-3.5 rounded-xl text-[10px] font-black uppercase transition-all ${state.subView === 'fixture' ? 'bg-blue-950 text-white shadow-lg' : 'text-slate-400 hover:text-blue-950'}">Fixture</button>
                            </div>
                        </div>

                        ${state.subView === 'tabla' ? `
                            <div class="bg-white rounded-[4rem] shadow-2xl border border-slate-200/60 overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left min-w-[700px]">
                                        <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase text-slate-400 tracking-[0.2em]">
                                            <tr>
                                                <th class="p-8 w-24 text-center">Pos</th>
                                                <th class="p-8">Club</th>
                                                <th class="p-8 text-center">PJ</th>
                                                <th class="p-8 text-center">PG</th>
                                                <th class="p-8 text-center">PE</th>
                                                <th class="p-8 text-center">PP</th>
                                                <th class="p-8 text-center">GF</th>
                                                <th class="p-8 text-center">GC</th>
                                                <th class="p-8 text-center">DG</th>
                                                <th class="p-8 text-center bg-yellow-500/10 text-yellow-600">PTS</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-100 text-sm">
                                            ${standings.map((club, i) => `
                                                <tr onclick="selectClubView('${club.name}')" class="cursor-pointer group hover:bg-slate-50 transition-colors">
                                                    <td class="p-8 text-center text-slate-300 font-black italic text-2xl group-hover:text-blue-950 transition-colors">${(i + 1).toString().padStart(2, '0')}</td>
                                                    <td class="p-8 flex items-center space-x-6">
                                                        <div class="w-14 h-14 bg-white rounded-2xl border border-slate-100 shadow-sm flex items-center justify-center p-2 shrink-0 group-hover:scale-110 transition-transform">
                                                            ${club.logo ? `<img src="${club.logo}" alt="Logo de ${club.name}" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'" /><span class="hidden text-blue-950 font-black italic text-lg uppercase">${club.name.substring(0,3)}</span>` : `<span class="text-blue-950 font-black italic text-lg uppercase">${club.name.substring(0,3)}</span>`}
                                                        </div>
                                                        <div class="flex flex-col">
                                                            <span class="text-blue-950 font-black italic uppercase text-2xl tracking-tighter leading-none">${club.name}</span>
                                                            <span class="text-[9px] font-bold text-blue-500 uppercase mt-2 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all">Ver Plantilla Detallada →</span>
                                                        </div>
                                                    </td>
                                                    <td class="p-8 text-center font-bold text-slate-400 text-lg">${club.pj}</td>
                                                    <td class="p-8 text-center font-bold text-slate-500">${club.pg}</td>
                                                    <td class="p-8 text-center font-bold text-slate-500">${club.pe}</td>
                                                    <td class="p-8 text-center font-bold text-slate-500">${club.pp}</td>
                                                    <td class="p-8 text-center font-bold text-slate-500">${club.gf}</td>
                                                    <td class="p-8 text-center font-bold text-slate-500">${club.gc}</td>
                                                    <td class="p-8 text-center font-black ${club.dg >= 0 ? 'text-emerald-600' : 'text-rose-500'} text-lg">${club.dg > 0 ? '+' : ''}${club.dg}</td>
                                                    <td class="p-8 text-center bg-yellow-50/50 text-blue-950 font-black text-4xl italic">${club.pts}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ` : `
                            <div class="space-y-14">
                                ${Object.entries(groupFixturesByRound(activeFixture)).map(([roundLabel, matches]) => `
                                    <section class="space-y-6" aria-labelledby="round-${fixtureRoundNumber(matches[0])}">
                                        <div class="flex items-center gap-5">
                                            <div class="h-px flex-1 bg-gradient-to-r from-transparent to-slate-300"></div>
                                            <h3 id="round-${fixtureRoundNumber(matches[0])}" class="shrink-0 bg-blue-950 text-white px-7 py-3 rounded-2xl text-sm font-black uppercase italic tracking-[0.2em] shadow-lg">${roundLabel}</h3>
                                            <div class="h-px flex-1 bg-gradient-to-l from-transparent to-slate-300"></div>
                                        </div>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        ${matches.map((match) => `
                                    <div class="bg-white rounded-[3rem] p-8 shadow-xl border border-slate-100 relative overflow-hidden group hover:-translate-y-1 transition-transform">
                                        <div class="flex items-center justify-between mb-8 mt-4">
                                            <div class="text-center flex-1">
                                                <div class="w-16 h-16 mx-auto mb-4 bg-slate-50 rounded-2xl p-3 flex items-center justify-center border">
                                                    ${getClubLogo(match.local) ? `<img src="${getClubLogo(match.local)}" alt="Logo de ${match.local}" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'" /><span class="hidden text-blue-950 font-black italic text-lg uppercase">${match.local.substring(0,3)}</span>` : `<span class="text-blue-950 font-black italic text-lg uppercase">${match.local.substring(0,3)}</span>`}
                                                </div>
                                                <span class="text-blue-950 font-black uppercase italic text-sm block tracking-tighter leading-none">${match.local}</span>
                                            </div>
                                            <div class="px-4 text-center">
                                                ${match.status === 'played' ? `
                                                    <div class="bg-blue-950 text-white font-black text-3xl italic px-5 py-2.5 rounded-2xl shadow-lg leading-none">
                                                        ${match.golesL} - ${match.golesV}
                                                    </div>
                                                ` : `
                                                    <span class="text-slate-200 font-black text-2xl italic">VS</span>
                                                `}
                                            </div>
                                            <div class="text-center flex-1">
                                                <div class="w-16 h-16 mx-auto mb-4 bg-slate-50 rounded-2xl p-3 flex items-center justify-center border">
                                                    ${getClubLogo(match.visita) ? `<img src="${getClubLogo(match.visita)}" alt="Logo de ${match.visita}" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'" /><span class="hidden text-blue-950 font-black italic text-lg uppercase">${match.visita.substring(0,3)}</span>` : `<span class="text-blue-950 font-black italic text-lg uppercase">${match.visita.substring(0,3)}</span>`}
                                                </div>
                                                <span class="text-blue-950 font-black uppercase italic text-sm block tracking-tighter leading-none">${match.visita}</span>
                                            </div>
                                        </div>
                                        <div class="pt-6 border-t border-slate-50 flex justify-between items-center text-slate-400 font-semibold">
                                            <div class="flex items-center gap-2">
                                                <svg class="w-4 h-4 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clipRule="evenodd"></path></svg>
                                                <span class="text-[9px] font-black uppercase tracking-widest">${match.hora === 'Por definir' ? 'Horario por definir' : `${match.hora} HRS`}</span>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <svg class="w-4 h-4 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clipRule="evenodd"></path></svg>
                                                <span class="text-[9px] font-black uppercase tracking-widest">${match.cancha}</span>
                                            </div>
                                        </div>
                                    </div>
                                        `).join('')}
                                        </div>
                                    </section>
                                `).join('')}
                                ${activeFixture.length === 0 ? `
                                    <div class="col-span-full py-20 bg-white rounded-[3rem] shadow-xl border border-slate-100 text-center">
                                        <p class="text-xl font-black italic text-slate-300 uppercase tracking-widest">No hay partidos programados para esta categoría</p>
                                    </div>
                                ` : ''}
                            </div>
                        `}
                    </div>
                </main>
                ${renderFooter()}
            </div>`;
        }

        function render() {
            const root = document.getElementById('app-root');
            if (state.view === 'lobby') {
                document.body.className = "bg-slate-950 font-sans text-slate-900 antialiased overflow-x-hidden";
                root.innerHTML = renderLobby();
            } else if (state.view === 'liga') {
                document.body.className = "bg-slate-50 font-sans text-slate-900 antialiased overflow-x-hidden";
                root.innerHTML = renderLiga();
            } else if (state.view === 'admin') {
                document.body.className = "bg-slate-900 font-sans text-slate-300 antialiased overflow-x-hidden";
                root.innerHTML = renderAdmin();
            }
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
