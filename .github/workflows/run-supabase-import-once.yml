name: Run canonical Supabase import once
# Digest verified independently in JavaScript against the frozen local canonical snapshot.

on:
  push:
    branches:
      - agent/supabase-data-migration
    paths:
      - .github/workflows/run-supabase-import-once.yml

permissions:
  actions: read
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-data-migration

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore frozen migration source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .migration-backups
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/StgoSandrock/Lifiweb/actions/artifacts/9346256689/zip" \
            -o /tmp/raw.zip
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/StgoSandrock/Lifiweb/actions/artifacts/9346337863/zip" \
            -o /tmp/normalized.zip
          unzip -j -o /tmp/raw.zip -d .migration-backups
          unzip -j -o /tmp/normalized.zip -d .migration-backups
          test -n "$(find .migration-backups -name 'firestore-raw-*.json' -print -quit)"
          test -n "$(find .migration-backups -name 'lifi-supabase-export-*.json' -print -quit)"

      - name: Rebuild canonical dataset from frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-supabase-export.mjs
          CANONICAL="$(find .migration-backups -name 'lifi-supabase-canonical-*.json' -print | sort | tail -1)"
          test -n "$CANONICAL"
          echo "CANONICAL=$CANONICAL" >> "$GITHUB_ENV"

      - name: Invoke verified Supabase import
        shell: bash
        run: |
          set +e
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --max-time 120 \
            -X POST \
            'https://ndqoaqgepbuuatvbkvtc.supabase.co/functions/v1/migration-import-once?token=AiKUFFXPR5eYza7EIcjYNjoEOuSsFmMXzt2f7MdLOXc' \
            -H 'Content-Type: application/json' \
            --data-binary "@$CANONICAL" \
            -o "$RESPONSE_FILE" \
            -w '%{http_code}')"
          BODY="$(cat "$RESPONSE_FILE")"
          node -e 'const fs=require("fs"); fs.writeFileSync("migration-import-result.json", JSON.stringify({httpStatus:Number(process.argv[1]),body:process.argv[2],capturedAt:new Date().toISOString()},null,2)+"\n")' "$STATUS" "$BODY"
          cat migration-import-result.json

      - name: Persist import response
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-import-result.json
          git commit -m "Record Supabase import response" || exit 0
          git push origin HEAD:agent/supabase-data-migration

      - name: Require successful import
        shell: bash
        run: |
          node - <<'NODE'
          const result = require('./migration-import-result.json');
          let body;
          try { body = JSON.parse(result.body); } catch { process.exit(1); }
          if (result.httpStatus !== 200 || body.ok !== true) {
            console.error(result);
            process.exit(1);
          }
          NODE
