name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: supabase-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - run: node --check scripts/migrate-to-supabase.mjs
      - run: node --check scripts/export-firestore-raw.mjs
      - run: node --check scripts/build-supabase-export.mjs
      - run: node --check scripts/reconcile-supabase-export.mjs
      - name: Validate local fallback mapping without live Firestore reads
        run: pnpm migrate:supabase:dry
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
