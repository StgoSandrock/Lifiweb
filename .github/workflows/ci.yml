name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/migrate-to-supabase.mjs
      - run: node --check scripts/export-firestore-raw.mjs
      - run: node --check scripts/build-supabase-export.mjs
      - name: Export raw Firestore snapshot
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBLGMtJ6QJSNwakmD_PdgtstARICyu1sEI
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: lifiwebapp
          NEXT_PUBLIC_FIREBASE_ARTIFACT_ID: lifi-2026-prod
        run: node scripts/export-firestore-raw.mjs
      - name: Upload raw Firestore snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lifi-firestore-raw-snapshot
          path: .migration-backups/firestore-raw-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Build normalized zero-loss Supabase export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBLGMtJ6QJSNwakmD_PdgtstARICyu1sEI
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: lifiwebapp
          NEXT_PUBLIC_FIREBASE_ARTIFACT_ID: lifi-2026-prod
        run: node scripts/build-supabase-export.mjs
      - name: Upload normalized Supabase export
        uses: actions/upload-artifact@v4
        with:
          name: lifi-supabase-normalized-export
          path: .migration-backups/lifi-supabase-export-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
