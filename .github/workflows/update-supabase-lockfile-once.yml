name: Update Supabase lockfile once

on:
  push:
    branches:
      - agent/supabase-data-migration
    paths:
      - .github/workflows/update-supabase-lockfile-once.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-data-migration
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        shell: bash
        run: |
          set +e
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee lockfile-result.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> lockfile-result.log
          exit 0
      - name: Commit lockfile and diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml lockfile-result.log
          git commit -m "Update lockfile for Supabase SDK" || exit 0
          git push origin HEAD:agent/supabase-data-migration
